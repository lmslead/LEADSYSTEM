server {

    server_name olivialms.cloud www.olivialms.cloud;
    client_max_body_size 20M;

    root /home/ubuntu/lms-build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — WebSocket upgrade + sticky-session cookie so HTTP-polling
    # requests from the same client always land on the same PM2 worker.
    # The sticky cookie is set by nginx; no application changes needed.
    location /socket.io {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Sticky session: set a cookie on the first request so that all
        # subsequent polling requests from the same browser go to the same
        # upstream worker.  Requires nginx compiled with --with-http_sticky_module
        # or the community sticky module.  If the module is not available,
        # these lines are ignored and WebSocket transport (the default) works
        # correctly without stickiness because it uses a persistent TCP connection.
        # sticky cookie srv_id expires=1h domain=.olivialms.cloud path=/socket.io;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/olivialms.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/olivialms.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.olivialms.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = olivialms.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name olivialms.cloud www.olivialms.cloud;
    return 404; # managed by Certbot




}